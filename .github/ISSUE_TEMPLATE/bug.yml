name: 缺陷报告
description: 报告可复现的错误或行为不一致
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: trigger
    attributes:
      label: 触发步骤
      description: 从打开应用开始，按顺序写出操作。
      placeholder: "1. 导入……\n2. 点击……\n3. 出现……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交号
      placeholder: "例如 0.1.0 / 309df5b"
  - type: dropdown
    id: area
    attributes:
      label: 模块
      options:
        - 赛题与附件导入
        - 引导式解题
        - Python 沙箱
        - LaTeX 与 PDF
        - AI 对话与模型
        - 合规导出
        - 安装与运行环境
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先删除 API Key、个人信息和赛题敏感数据。
